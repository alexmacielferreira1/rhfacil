name: gestao-de-funcionarios

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.31.0
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV}
      APP_NAME: ${APP_NAME}
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET:-development-only-change-me}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_SENDER: ${EMAIL_SENDER:-no-reply@example.test}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      UPLOAD_ROOT: /data/uploads
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/services', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 18
      start_period: 10s
    restart: unless-stopped
    networks: [internal]
    volumes:
      - uploads_data:/data/uploads

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET:-development-only-change-me}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_SENDER: ${EMAIL_SENDER:-no-reply@example.test}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    depends_on:
      backend: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT}:5173"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
  uploads_data:

networks:
  internal:
    driver: bridge

[project]
name = "gestao-de-funcionarios-backend"
version = "0.1.0"
description = "Backend modular da Gestão de Funcionários"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18.5,<2.0.0",
    "fastapi[standard]>=0.136.3,<0.137.0",
    "httpx>=0.28.1,<0.29.0",
    "asyncpg>=0.31.0,<0.32.0",
    "pwdlib[argon2]>=0.3.0,<0.4.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "redis>=6.0.0,<8.0.0",
    "sqlalchemy[asyncio]>=2.0.51,<3.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "app" }]

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.15.0,<0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations", ".poetry-cache", ".virtualenv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true
